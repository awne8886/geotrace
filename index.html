precision highp float;
attribute vec3 a_pos;
attribute float a_elev;
attribute float a_light;
attribute vec3 a_tan;
uniform mat3 u_rot;
uniform vec2 u_center;
uniform float u_R;
uniform vec2 u_view;
uniform float u_dpr;
uniform float u_size;
uniform float u_relief;
uniform float u_pass;   // 0 far side, 1 near side, 2 night glow
uniform float u_calm;
uniform float u_night;
uniform float u_detail;
uniform float u_alpha;
uniform float u_maxSize;
uniform vec3 u_light;
uniform float u_bump;
uniform vec4 u_cap;     // xyz centre, w cos(outer radius); w < -1.5 = no cap
uniform float u_capIn;
uniform vec4 u_hole0;
uniform float u_hole0In;
uniform float u_hole0A;
uniform vec4 u_hole1;
uniform float u_hole1In;
uniform float u_hole1A;
varying vec4 v_col;
varying float v_aa;
varying float v_glow;
varying float v_bead;

void hide() {
  gl_Position = vec4(2.0, 2.0, 2.0, 1.0);
  gl_PointSize = 0.0;
  v_col = vec4(0.0);
  v_aa = 1.0;
  v_glow = 0.0;
  v_bead = 0.0;
}

  layerA *= 1.0 - u_hole1A * smoothstep(u_hole1.w, u_hole1In, dot(a_pos, u_hole1.xyz));
